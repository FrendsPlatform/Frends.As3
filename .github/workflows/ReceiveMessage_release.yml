name: ReceiveMessage_release
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/release.yml@main
    with:
      workdir: Frends.As3.ReceiveMessage
      dotnet_version: 8.0.x
      strict_analyzers: true
    secrets:
      feed_api_key: ${{ secrets.TASKS_FEED_API_KEY }}
      build_time_nuget_feed_url: ${{ secrets.BUILD_TIME_NUGET_FEED_URL }}
      build_time_nuget_feed_api_key: ${{ secrets.BUILD_TIME_NUGET_FEED_API_KEY }}
